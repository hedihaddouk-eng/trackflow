<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="110" fill="#0F172A"/>
  <!-- Beautiful blue tracking design -->
  <g transform="translate(64, 64) scale(0.75)">
    <!-- Scanner frame corners -->
    <path d="M 40 100 L 40 40 L 100 40" stroke="#0066FF" stroke-width="24" stroke-linecap="round" fill="none"/>
    <path d="M 412 100 L 412 40 L 352 40" stroke="#0066FF" stroke-width="24" stroke-linecap="round" fill="none"/>
    <path d="M 40 352 L 40 412 L 100 412" stroke="#0066FF" stroke-width="24" stroke-linecap="round" fill="none"/>
    <path d="M 412 352 L 412 412 L 352 412" stroke="#0066FF" stroke-width="24" stroke-linecap="round" fill="none"/>
    
    <!-- Barcode bars representing production tracking -->
    <rect x="110" y="120" width="16" height="212" fill="#E2E8F0" rx="6"/>
    <rect x="150" y="120" width="32" height="212" fill="#E2E8F0" rx="8"/>
    <rect x="206" y="120" width="16" height="212" fill="#E2E8F0" rx="6"/>
    <rect x="246" y="120" width="48" height="212" fill="#0066FF" rx="10"/>
    <rect x="318" y="120" width="16" height="212" fill="#E2E8F0" rx="6"/>
    <rect x="358" y="120" width="32" height="212" fill="#E2E8F0" rx="8"/>
    
    <!-- Laser line -->
    <line x1="60" y1="226" x2="392" y2="226" stroke="#EF4444" stroke-width="12" stroke-linecap="round" stroke-dasharray="1 15" opacity="0.8"/>
  </g>
</svg>
